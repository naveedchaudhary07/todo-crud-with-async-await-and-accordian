      <h3 class="text-center bg-info p-4 text-white">Todo With Checkbox And</h3>
    
    <div class="container-fluid mt-4">
      <div class="row d-flex justify-content-between">
        <div class="col-md-5 mt-4">
          <form id="todo_form">
            <div class="card ">
              <div class="card-header bg-secondary text-white text-center">
                <h4>Todo Form</h4>
              </div>
              <div class="card-body">
                <div class="form-group">
                  <label for="todo_item">Todo Item</label>
                  <input type="text" class="form-control" required autocomplete="off" id="todo_item" />
                </div>
                <div class="form-group">
                  <label for="todo_des">Description</label>
                  <input type="text" class="form-control" required autocomplete="off" id="todo_des" />
                </div>
                <div class="form-group">
                  <label for="todo_iscompleted">Is comepleted</label>
                  <select name="" id="todo_iscompleted" required autocomplete="off" class="form-control">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                  </select>
                </div>
              </div>
              <div class="card-footer bg-secondary text-white">
                <button class="btn btn-info btn-block" id="add_btn">Add Todo</button>
                <button type="button" class="btn btn-warning d-none btn-block" id="update_btn">Update Todo</button>
              </div>
            </div>
          </form>
        </div>
